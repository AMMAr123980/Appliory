# Copied Sites are standalone projects and cannot inherit the monorepo policy.
minimumReleaseAge: 10080
minimumReleaseAgeIgnoreMissingTime: false
trustLockfile: false
strictDepBuilds: true
allowBuilds:
  esbuild: true
  fsevents: true
  sharp: true
  unrs-resolver: true
  workerd: true
storeDir: ${SITES_PNPM_SHARED_STORE:-.sites-runtime/pnpm-store}
cacheDir: ${SITES_PNPM_SHARED_STORE:-.sites-runtime/pnpm-store}/policy-cache
enableGlobalVirtualStore: false
# Reuse store files with clones or hardlinks before falling back to copies.
packageImportMethod: auto
# The explicit installer owns dependency setup, including restored workspaces.
verifyDepsBeforeRun: false
optimisticRepeatInstall: false
overrides:
  "@babel/core": "^7.29.6"
  "browserslist": "^4.28.7"
  "baseline-browser-mapping": "^2.11.0"
  "fast-uri": "3.1.9"
  "source-map-js": "^1.2.2"
  "sharp": "^0.35.5"
  "esbuild": "0.28.1"
  "ws": "8.21.0"
  "undici": "7.30.1"
  "js-yaml": "4.3.2"
  "brace-expansion@^1.1.7": "1.1.21"
  "brace-expansion@^5.0.0": "5.0.12"
  "fflate@0.7.4": "0.7.5"
  "image-size": "2.0.3"

# Narrow exceptions allow reviewed security patches inside the normal seven-day release hold.
minimumReleaseAgeExclude:
  - "react@19.2.8"
  - "react-dom@19.2.8"
  - "react-server-dom-webpack@19.2.8"
  - "vite@8.1.6"
  - "fast-uri@3.1.9"
  - "esbuild@0.28.1"
  - "ws@8.21.0"
  - "undici@7.30.1"
  - "js-yaml@4.3.2"
  - "image-size@2.0.3"
  - "brace-expansion@1.1.21"
  - "fflate@0.7.5"
  - "brace-expansion@5.0.12"
